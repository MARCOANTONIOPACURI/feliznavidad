<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Navidad 🎄</title>
    <link rel="shortcut icon" href="ico.jpg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Botón de control de música -->
    <div class="music-control" id="musicControl" onclick="toggleMusic()">
        <svg id="playIcon" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z" />
        </svg>
        <svg id="pauseIcon" style="display: none;" viewBox="0 0 24 24">
            <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z" />
        </svg>
    </div>

    <!-- Landing Page -->
    <div class="landing">
        <div class="christmas-tree">🎄</div>
        <h1>¡Feliz Navidad!</h1>
        <p class="subtitle">Elige una galleta para ver tu mensaje especial</p>

        <div class="cookies-container">
            <div class="cookie-btn" onclick="openModal('manuela')">
                <span>MANUELA</span>
            </div>
            <div class="cookie-btn" onclick="openModal('lincer')">
                <span>LINCER</span>
            </div>
            <div class="cookie-btn" onclick="openModal('kiara')">
                <span>KIARA</span>
            </div>
        </div>
    </div>

    <!-- Modal Login -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeLoginModal()">&times;</span>
            <h2 class="modal-title">🔐 Acceso Secreto</h2>
            <div class="modal-message">
                <p style="margin-bottom: 20px;">Para ver tu mensaje especial, escribe:</p>
                <p style="font-weight: bold; color: #c0392b; margin-bottom: 20px;">La última palabra que te dije</p>
                <input type="password" id="passwordInput" placeholder="Escribe aquí..."
                    style="width: 100%; padding: 15px; font-size: 1.1em; border: 2px solid #ffd700; border-radius: 10px; margin-bottom: 20px; text-align: center;">
                <button onclick="checkPassword()"
                    style="width: 100%; padding: 15px; font-size: 1.2em; background: linear-gradient(135deg, #c0392b, #e74c3c); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">Entrar
                    🎁</button>
                <p id="errorMessage" style="color: #c0392b; margin-top: 15px; font-weight: bold; display: none;">❌
                    Palabra incorrecta, intenta de nuevo</p>
            </div>
        </div>
    </div>

    <!-- Modal Mensaje -->
    <div class="modal" id="messageModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeMessageModal()">&times;</span>
            <h2 class="modal-title" id="modal-title"></h2>
            <div class="modal-message" id="modal-message"></div>
            <div class="modal-footer">Con todo mi cariño ❤️🎄</div>
        </div>
    </div>

    <!-- Audio -->
    <audio id="christmasMusic" loop>
        <source src="rauw alejandro - aquel nap zzzz tu mi 24 de diciembre (LetraLyrics).mp3" type="audio/mpeg">
    </audio>

    <script>
        // Variables globales
        let isMusicPlaying = false;

        // Crear copos de nieve
        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.className = 'snowflake';
            snowflake.innerHTML = '❄';
            snowflake.style.left = Math.random() * 100 + '%';
            snowflake.style.animationDuration = (Math.random() * 3 + 2) + 's';
            snowflake.style.opacity = Math.random();
            document.body.appendChild(snowflake);

            setTimeout(() => {
                snowflake.remove();
            }, 5000);
        }

        // Crear corazones
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '💝';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        setInterval(createSnowflake, 300);
        setInterval(createHeart, 800);

        // Función para controlar la música
        function toggleMusic() {
            const music = document.getElementById('christmasMusic');
            const playIcon = document.getElementById('playIcon');
            const pauseIcon = document.getElementById('pauseIcon');
            const musicControl = document.getElementById('musicControl');

            if (isMusicPlaying) {
                music.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                musicControl.classList.remove('playing');
                isMusicPlaying = false;
            } else {
                music.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                musicControl.classList.add('playing');
                isMusicPlaying = true;
            }
        }

   



        // Mensajes personalizados con contraseñas
        const messages = {
            manuela: {
                title: '🎅 Para Manuela 🎁',
                message: 'Querida Manuela, en esta Navidad quiero desearte toda la felicidad del mundo. Que la magia de estas fiestas llene tu corazón de alegría, que tus sueños se hagan realidad y que el próximo año esté lleno de momentos maravillosos. Quiero que nunca olvides que eres una campeona, que puedes con todo lo que te propongas. No pierdas jamás tu sonrisa, porque es el regalo más hermoso que puedes brindar; pocos tienen el privilegio de tenerla cerca y verla iluminarlo todo. Soy muy afortunado de tenerte en mi vida, te quiero muchísimo y deseo que sean muchas Navidades más en comunión, compartiendo momentos llenos de amor y alegría. ¡Feliz Navidad! 🎄✨',
                password: 'Mi Risueña' // Cambia esta contraseña
            },
            lincer: {
                title: '⭐ Para Lincer 🎄',
                message: 'Querido Lincer, que esta Navidad llegue a tu vida llena de paz, amor y prosperidad. Que sea un tiempo de verdadera felicidad, pero también un momento de cambio, donde cada acción que realices siembre algo bueno en tu camino y te acerque a tus sueños. Que cada día del nuevo año sea una nueva oportunidad para crecer, aprender y cumplir tus metas.Quiero verte llegar a lo grande, porque sé que tienes todo para lograrlo. Te quiero mucho, hijo.Oro a Dios para verte cumplir cada paso de tu vida y compartir contigo muchos momentos más, muchas Navidades más, llenas de risas, abrazos y bendiciones.Gracias por ser parte tan importante de mi vida. ¡Te deseo una Navidad llena de bendiciones y un próspero Año Nuevo! 🎄✨',
                password: 'Mi Campeón' // Cambia esta contraseña
            },
            kiara: {
                title: '🌟 Para Kiara 💫',
                message: 'Querida Kiara, que la luz de la Navidad ilumine tu camino y te regale paz, esperanza y muchos motivos para sonreír. Que esta época tan especial te permita compartir momentos lindos con tus seres queridos y que el Año Nuevo llegue lleno de aprendizajes, alegrías y pequeñas victorias que hagan grande tu corazón. Eres una persona maravillosa y mereces todo lo bueno que la vida tiene preparado para ti. Gracias por la confianza; no sabes cuánto valoro esta amistad. Es de esas que enseñan, que suman y que crecen con el tiempo. Lo más bonito es que aprendemos juntos, a nuestro ritmo, entre risas, conversaciones sinceras y apoyo real. Te quiero mucho y le pido a Dios que esto no se acabe, que siga siendo así de bonito y verdadero. Recuerda siempre que puedes confiar en mí. Tienes a un amigo que no es perfecto, pero que todos los días intenta ser mejor, para él y para las personas que quiere, como tú. Pásala muy bien esta Navidad, dale un abrazo grande también a tus papis. Ojalá vengan muchas Navidades más, aunque sea en comunión virtual, con mensajes largos y risas incluidas. Posdata: prepárate para el canotaje… yo ya me imaginé chapando mi trucha como todo un campeón, aunque seguro el río tenga otros planes. Sigue brillando, estrella, pero recuerda que hay una luna delante de ti; no es para opacarla, es para hacerla aún más hermosa, y tú lo haces sin darte cuenta. Feliz Navidad y próspero Año Nuevo. 🎄✨',
                password: 'Mi estrella' // Cambia esta contraseña
            }
        };

        let currentPerson = '';

        function openModal(person) {
            currentPerson = person;
            const loginModal = document.getElementById('loginModal');
            document.getElementById('passwordInput').value = '';
            document.getElementById('errorMessage').style.display = 'none';
            loginModal.style.display = 'flex';
        }

        function closeLoginModal() {
            const loginModal = document.getElementById('loginModal');
            loginModal.style.display = 'none';
        }

        function closeMessageModal() {
            const messageModal = document.getElementById('messageModal');
            const music = document.getElementById('christmasMusic');
            messageModal.style.display = 'none';
            music.pause();
            isMusicPlaying = false;
            document.getElementById('playIcon').style.display = 'block';
            document.getElementById('pauseIcon').style.display = 'none';
            document.getElementById('musicControl').classList.remove('playing');
        }

        function checkPassword() {
            const input = document.getElementById('passwordInput').value.toLowerCase().trim();
            const correctPassword = messages[currentPerson].password.toLowerCase();
            const errorMessage = document.getElementById('errorMessage');

            if (input === correctPassword) {
                closeLoginModal();
                showMessage();
            } else {
                errorMessage.style.display = 'block';
            }
        }

        function showMessage() {
            const messageModal = document.getElementById('messageModal');
            const title = document.getElementById('modal-title');
            const message = document.getElementById('modal-message');
            const music = document.getElementById('christmasMusic');

            title.textContent = messages[currentPerson].title;
            message.textContent = messages[currentPerson].message;

            messageModal.style.display = 'flex';
            music.play();
            isMusicPlaying = true;
            document.getElementById('playIcon').style.display = 'none';
            document.getElementById('pauseIcon').style.display = 'block';
            document.getElementById('musicControl').classList.add('playing');
        }

        // Permitir Enter para enviar
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('passwordInput').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    checkPassword();
                }
            });
        });
    </script>
</body>

</html>
